[workspace]
members = [
    "crates/scry-addons",
    "crates/scry-app",
    "crates/scry-library",
    "crates/scry-playback",
    "crates/scry-torrents",
]
default-members = ["crates/scry-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", default-features = false }
url = "2"
tempfile = "3"
rune = { git = "https://github.com/anomalyco/rune", rev = "664b69ed1e76806f9e3b3fa79c8594e3b154700b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "664b69ed1e76806f9e3b3fa79c8594e3b154700b" }
uuid = { version = "1", features = ["v4"] }
windows-sys = "0.59"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_clone = "warn"
inefficient_to_string = "warn"
# Keep suppressions explicit and remove them when they stop applying.
allow_attributes_without_reason = "deny"
# Panic paths not covered by unwrap/expect or the panic! lint.
string_slice = "deny"
unimplemented = "deny"
unreachable = "deny"
unchecked_time_subtraction = "deny"
# Async work must not be silently dropped or retain synchronous borrows.
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
unused_result_ok = "deny"
# Native boundaries require a written safety argument, not just an unsafe block.
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
mem_forget = "deny"
debug_assert_with_mut_call = "deny"
rc_mutex = "deny"
exit = "deny"
lossy_float_literal = "deny"
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
