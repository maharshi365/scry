[workspace]
members = [
    "crates/scry-addons",
    "crates/scry-app",
    "crates/scry-library",
    "crates/scry-playback",
    "crates/scry-torrents",
]
default-members = ["crates/scry-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", default-features = false }
url = "2"
tempfile = "3"
rune = { git = "https://github.com/anomalyco/rune", rev = "e18cc657232a93af500b40917880c02cd4edd069" }
uuid = { version = "1", features = ["v4"] }
windows-sys = "0.59"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
