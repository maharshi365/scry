[workspace]
members = [".", "crates/scry-addons", "crates/scry-library"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", default-features = false }
url = "2"
tempfile = "3"

[package]
name = "scry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
scry-addons = { path = "crates/scry-addons" }
scry-library = { path = "crates/scry-library" }
rune = { git = "https://github.com/anomalyco/rune", rev = "e18cc657232a93af500b40917880c02cd4edd069" }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
url.workspace = true
libloading = "0.8"
directories = "6"
librqbit = { version = "8.1.1", default-features = false, features = ["default-tls"] }
axum = "0.7"
same-file = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
blake3 = "1"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
