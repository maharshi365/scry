[package]
name = "scry"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
anyhow = "1"
rune = { git = "https://github.com/anomalyco/rune", rev = "e18cc657232a93af500b40917880c02cd4edd069" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
libloading = "0.8"
directories = "6"
librqbit = { version = "8.1.1", default-features = false, features = ["default-tls"] }
axum = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
same-file = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
