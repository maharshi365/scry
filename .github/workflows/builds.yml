name: Test builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/build-desktop.yml
    with:
      sha: ${{ github.sha }}
  summary:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Scry builds
          Download the platform artifact from this run. Artifacts expire after 14 days.

          - **Windows x64:** run the setup EXE. It installs for the current user and includes mpv. SmartScreen may warn because this build is unsigned.
          - **macOS Apple Silicon:** open the PKG to install Scry in Applications (administrator access required). mpv is included. This build is not Developer ID signed or notarized; macOS may block it. Only override the warning in Privacy & Security if you trust the download.

          To update, close Scry and run the newer installer. App data is kept outside the installed files and is not removed. In-app updates are not implemented.

          Each download includes a SHA-256 checksum. No signing credentials are needed.
          EOF
