name: Build desktop

# Based on anomalyco/hex: unprivileged builds produce downloadable artifacts.
# Signing and publishing do not run in these jobs.
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      release:
        type: boolean
        default: false
      sccache:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  CARGO_BUILD_WARNINGS: deny

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: validation-v1-${{ matrix.platform }}
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows/setup-runtime.ps1
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/runtime"
      - name: Prepare macOS
        if: runner.os == 'macOS'
        run: |
          bash scripts/macos/setup.sh
          xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Test (all features)
        run: cargo test --workspace --all-targets --all-features --locked
  build:
    name: ${{ matrix.platform }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-${{ matrix.platform }}
          prefix-key: release-v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        if: inputs.sccache
        with:
          version: v0.19.0
      - name: Enable compiler cache
        if: inputs.sccache
        shell: bash
        run: |
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
          echo 'SCCACHE_GHA_VERSION=scry-release-v1-${{ matrix.platform }}' >> "$GITHUB_ENV"
      - name: Set build version
        id: version
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--format-version", "1", "--locked"
          ]))
          base = next(p["version"] for p in metadata["packages"] if p["name"] == "scry-app")
          sha = subprocess.check_output(["git", "rev-parse", "--short=7", "HEAD"], text=True).strip()
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", tag):
                  raise SystemExit("Release tags must have the form v1.2.3 (optional prerelease/build suffix).")
              version = tag[1:]
          elif os.environ["RELEASE"] == "true":
              major, minor, patch = base.split('+')[0].split('-')[0].split('.')
              version = f"{major}.{minor}.{int(patch) + int(os.environ['GITHUB_RUN_NUMBER'])}"
          else:
              version = f"{base.split('+')[0].split('-')[0]}-dev.{os.environ['GITHUB_RUN_NUMBER']}+{sha}"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SCRY_BUILD_VERSION={version}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows/setup-runtime.ps1
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/runtime"
      - name: Prepare macOS
        if: runner.os == 'macOS'
        run: |
          bash scripts/macos/setup.sh
          brew install dylibbundler
          xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/package.ps1 -Destination "$env:RUNNER_TEMP/dist"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/macos/package.sh "$RUNNER_TEMP/dist"
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test-package.ps1 -Installer "$env:RUNNER_TEMP/dist/Scry-$env:SCRY_BUILD_VERSION-windows-x64-setup.exe"
      - name: Check macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/macos/test-package.sh "$RUNNER_TEMP/dist/Scry-$SCRY_BUILD_VERSION-macos-arm64.pkg"
      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-timings-${{ matrix.platform }}
          path: target/cargo-timings/
          if-no-files-found: warn
          retention-days: 14
      - name: Report signing status
        shell: bash
        run: |
          echo 'Installers are unsigned (macOS uses local ad-hoc app signatures only). Updates require closing Scry and running the newer installer. Developer signing, notarization, and in-app updates are not configured.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scry-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14
