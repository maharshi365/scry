name: Release

on:
  workflow_dispatch:
    inputs:
      sccache:
        description: Use the experimental Rust compiler cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    uses: ./.github/workflows/build-desktop.yml
    with:
      sha: ${{ github.sha }}
      release: true
      sccache: ${{ inputs.sccache }}
  publish:
    name: Draft GitHub release
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: scry-*
          path: dist
          merge-multiple: true
      - name: Verify downloads and version
        working-directory: dist
        env:
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(Scry-*-setup.exe Scry-*.pkg)
          checksums=(Scry-*.sha256)
          test "${#archives[@]}" -eq 2
          test "${#checksums[@]}" -eq 2
          sha256sum --check --strict -- *.sha256
          test -f "Scry-$VERSION-windows-x64-setup.exe"
          test -f "Scry-$VERSION-macos-arm64.pkg"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.desktop.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" dist/* --target "$COMMIT" --draft --title "Scry v$VERSION" --notes 'Unsigned preview installers with mpv included. Windows: run the setup EXE (per-user install). macOS (Apple Silicon): open the PKG to install in Applications (administrator access required). To update, close Scry and run the newer installer; user data is preserved. No in-app updater is included. Windows SmartScreen and macOS Gatekeeper may block unsigned downloads. Developer signing and notarization are not configured. Review runtime redistribution licensing before publishing this draft.'
