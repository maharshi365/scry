[package]
name = "scry-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
diesel = { version = "2.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Bundle SQLite for Diesel so users do not need a system SQLite installation.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
