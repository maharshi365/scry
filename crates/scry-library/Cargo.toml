[package]
name = "scry-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# Enables bundled SQLite for Diesel; no direct Rust API calls are needed.
ignored = ["libsqlite3-sys"]

[dependencies]
anyhow.workspace = true
diesel = { version = "2.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
# Bundle SQLite for Diesel so users do not need a system SQLite installation.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true
criterion = "0.7"
allocation-counter = "0.8"

[[bench]]
name = "library"
harness = false
