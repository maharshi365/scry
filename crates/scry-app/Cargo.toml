[package]
name = "scry-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "scry"

[[bin]]
name = "scry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
scry-addons = { path = "../scry-addons" }
scry-library = { path = "../scry-library" }
scry-playback = { path = "../scry-playback" }
scry-torrents = { path = "../scry-torrents" }
rune.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
uuid.workspace = true
url.workspace = true
directories = "6"
same-file = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
blake3 = "1"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
